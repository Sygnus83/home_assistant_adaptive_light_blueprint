blueprint:
  name: Adaptive Light Controller v1.2
  author: Sygnus
  description: "v1.2.3 - Advanced adaptive controller with Sleep Mode, Circadian support, and Smart Presence filtering."
  source_url: https://raw.githubusercontent.com/Sygnus83/home_assistant_adaptive_light_blueprint/refs/heads/main/blueprints/automation/adaptive_light_controller.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    light_sensor_entity:
      name: Light Sensor
      description: Ambient-light sensor.
      selector:
        entity:
          filter: [{domain: sensor, device_class: illuminance}]
    trigger_light:
      name: Trigger Light (Optional)
      description: Run when any selected light turns on.
      default: []
      selector:
        entity:
          filter: [{domain: light}]
          multiple: true
    target_light:
      name: Target lights (select individual light entities)
      description: Only selected lights that are already on will be adjusted.
      selector:
        entity:
          filter: [{domain: light}]
          multiple: true
    enable_periodic_update:
      name: Enable periodic update (Optional)
      description: Run the automation regularly, even if the light sensor value does not change.
      default: false
      selector: {boolean: {}}
    periodic_update_interval:
      name: Periodic update interval
      description: How often to update the lights when periodic update is enabled.
      default: "/5"
      selector:
        select:
          options:
            - {label: Every 1 minute, value: "/1"}
            - {label: Every 2 minutes, value: "/2"}
            - {label: Every 3 minutes, value: "/3"}
            - {label: Every 4 minutes, value: "/4"}
            - {label: Every 5 minutes, value: "/5"}
            - {label: Every 6 minutes, value: "/6"}
            - {label: Every 7 minutes, value: "/7"}
            - {label: Every 8 minutes, value: "/8"}
            - {label: Every 9 minutes, value: "/9"}
            - {label: Every 10 minutes, value: "/10"}
    enable_presence_brightness:
      name: Enable presence/motion brightness (Optional)
      description: Use a fixed brightness when none of the selected presence or motion sensors are on.
      default: false
      selector: {boolean: {}}
    presence_entities:
      name: Presence or motion sensor(s)
      description: Select binary sensors. If at least one is on, normal lux-based brightness is used.
      default: []
      selector:
        entity:
          filter: [{domain: binary_sensor}]
          multiple: true
    presence_hold_time:
      name: Presence Hold Time
      description: Wait this many seconds after motion stops before dimming the lights.
      default: 30
      selector:
        number: {min: 0, max: 600, step: 1, unit_of_measurement: s, mode: slider}
    no_presence_brightness:
      name: Brightness when no presence is detected
      default: 20
      selector:
        number: {min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    enable_sensor_fallback:
      name: Enable unavailable lux sensor fallback (Optional)
      description: Use a fixed brightness if the lux sensor state is unknown or unavailable.
      default: false
      selector: {boolean: {}}
    sensor_fallback_brightness:
      name: Brightness when lux sensor is unavailable
      default: 50
      selector:
        number: {min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    enable_sun_schedule:
      name: Enable sunrise/sunset schedule (Optional)
      description: Limit the automation to the selected part of the day.
      default: false
      selector: {boolean: {}}
    sun_schedule_mode:
      name: Sunrise/sunset schedule
      default: night
      selector:
        select:
          options:
            - {label: Run from sunset to sunrise, value: night}
            - {label: Run from sunrise to sunset, value: day}
    sunrise_offset:
      name: Sunrise offset
      description: Negative values are before sunrise; positive values are after sunrise.
      default: 0
      selector:
        number: {min: -60, max: 60, step: 5, unit_of_measurement: min, mode: slider}
    sunset_offset:
      name: Sunset offset
      description: Negative values are before sunset; positive values are after sunset.
      default: 0
      selector:
        number: {min: -60, max: 60, step: 5, unit_of_measurement: min, mode: slider}
    enable_cover_condition:
      name: Enable cover condition (Optional)
      description: Limit the automation based on the selected cover position.
      default: false
      selector: {boolean: {}}
    cover_entities:
      name: Cover(s)
      description: Select one or more covers. At least one must meet the position rule.
      default: []
      selector:
        entity:
          filter: [{domain: cover}]
          multiple: true
    cover_position_mode:
      name: Cover position rule
      default: below
      selector:
        select:
          options:
            - {label: At or below the threshold, value: below}
            - {label: At or above the threshold, value: above}
    cover_position_threshold:
      name: Cover position threshold
      default: 50
      selector:
        number: {min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    run_conditions:
      name: Conditions
      description: Only run when these conditions are met.
      default: []
      selector: {condition: {}}
    max_brightness_value:
      name: Maximum ambient light value
      description: Lux level for brightness at maximum light level.
      default: 500
      selector:
        number: {min: 0, max: 3000, step: 10, unit_of_measurement: lx, mode: slider}
    min_brightness_value:
      name: Minimum ambient light value
      description: Lux level for brightness at minimum light level.
      default: 0
      selector:
        number: {min: 0, max: 1500, step: 10, unit_of_measurement: lx, mode: slider}
    light_value_1:
      name: Brightness at maximum light level
      default: 0
      selector:
        number: {min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    light_value_2:
      name: Brightness at minimum light level
      default: 100
      selector:
        number: {min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    minimum_brightness_change:
      name: Minimum brightness change
      description: Only send an update when brightness differs by at least this amount.
      default: 0
      selector:
        number: {min: 0, max: 30, step: 1, unit_of_measurement: "%", mode: slider}
    sleep_mode_section:
      name: Night / Sleep Mode Settings
      icon: mdi:bed
      collapsed: true
      input:
        sleep_mode_entity:
          name: Sleep Mode Entity (Optional)
          description: An input_boolean or binary_sensor. If ON, sleep brightness is used.
          default: none
          selector:
            entity:
              filter: [{domain: [input_boolean, binary_sensor]}]
        sleep_brightness:
          name: Sleep Mode Brightness
          default: 5
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    manual_override_entity:
      name: Manual Override Helper (Optional)
      description: "An input_boolean. If this is ON, the automation will skip updates."
      default: none
      selector:
        entity:
          filter: [{domain: input_boolean}]
    transition_time:
      name: Transition time
      default: 0
      selector:
        number: {min: 0, max: 300, step: 1, unit_of_measurement: s, mode: slider}
    color_or_temp_section:
      name: Color or temperature settings
      icon: mdi:palette
      collapsed: true
      input:
        include_color_or_temp:
          name: Include color or temperature
          default: include_no_color_temp
          selector:
            select:
              options:
                - {label: Do not set color or temperature, value: include_no_color_temp}
                - {label: Set color, value: include_color}
                - {label: Set temperature, value: include_temp}
                - {label: Follow Circadian rhythm (Sun elevation), value: include_circadian}
        light_color:
          name: Light color
          default: [255, 255, 255]
          selector: {color_rgb: {}}
        light_temp:
          name: Light temperature (Kelvin)
          default: 4000
          selector:
            number: {min: 2000, max: 6500, step: 50, unit_of_measurement: K, mode: slider}
        circadian_min_temp:
          name: Circadian Minimum Temperature (Warm)
          default: 2200
          selector:
            number: {min: 2000, max: 5000, step: 50, unit_of_measurement: K}
        circadian_max_temp:
          name: Circadian Maximum Temperature (Cold)
          default: 5500
          selector:
            number: {min: 4000, max: 7000, step: 50, unit_of_measurement: K}
    brightness_over_under_section:
      name: Brightness values when outside range
      icon: mdi:cog-transfer-outline
      collapsed: true
      input:
        include_brightness_over_under:
          name: Include brightness values when outside range
          default: false
          selector: {boolean: {}}
        light_brightness_over_max:
          name: Brightness when ambient light value over max.
          default: 0
          selector:
            number: {min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
        light_brightness_under_min:
          name: Brightness when ambient light value under min.
          default: 100
          selector:
            number: {min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider}
    color_or_temp_over_under_section:
      name: Color or temperature settings when outside range
      icon: mdi:palette
      collapsed: true
      input:
        include_color_or_temp_over_under:
          name: Include color or temperature values when outside range
          default: include_no_color_temp_outside_range
          selector:
            select:
              options:
                - {label: Do not set color or temperature when outside range, value: include_no_color_temp_outside_range}
                - {label: Set color when outside range, value: include_color_outside_range}
                - {label: Set temperature when outside range, value: include_temp_outside_range}
        light_color_over_max:
          name: Color when ambient light value over max.
          default: [255, 255, 255]
          selector: {color_rgb: {}}
        light_color_under_min:
          name: Color when ambient light value under min.
          default: [255, 255, 255]
          selector: {color_rgb: {}}
        light_temp_over_max:
          name: Temperature when ambient light value over max. (Kelvin)
          default: 4000
          selector:
            number: {min: 2000, max: 6500, step: 50, unit_of_measurement: K, mode: slider}
        light_temp_under_min:
          name: Temperature when ambient light value under min. (Kelvin)
          default: 4000
          selector:
            number: {min: 2000, max: 6500, step: 50, unit_of_measurement: K, mode: slider}

mode: restart

variables:
  sensor: !input light_sensor_entity
  min_lux: !input min_brightness_value
  max_lux: !input max_brightness_value
  min_level: !input light_value_2
  max_level: !input light_value_1
  outside: !input include_brightness_over_under
  below_level: !input light_brightness_under_min
  above_level: !input light_brightness_over_max
  color_mode: !input include_color_or_temp
  outside_color_mode: !input include_color_or_temp_over_under
  color: !input light_color
  color_below: !input light_color_under_min
  color_above: !input light_color_over_max
  temp: !input light_temp
  temp_below: !input light_temp_under_min
  temp_above: !input light_temp_over_max
  circadian_min: !input circadian_min_temp
  circadian_max: !input circadian_max_temp
  sleep_entity: !input sleep_mode_entity
  sleep_level: !input sleep_brightness
  override_entity: !input manual_override_entity
  transition: !input transition_time
  enable_presence_brightness: !input enable_presence_brightness
  presence_entities: !input presence_entities
  hold_time: !input presence_hold_time
  no_presence_brightness: !input no_presence_brightness
  enable_sensor_fallback: !input enable_sensor_fallback
  sensor_fallback_brightness: !input sensor_fallback_brightness
  enable_sun_schedule: !input enable_sun_schedule
  sun_schedule_mode: !input sun_schedule_mode
  sunrise_offset: !input sunrise_offset
  sunset_offset: !input sunset_offset
  enable_cover_condition: !input enable_cover_condition
  cover_entities: !input cover_entities
  cover_position_mode: !input cover_position_mode
  cover_position_threshold: !input cover_position_threshold
  target_lights: !input target_light
  minimum_brightness_change: !input minimum_brightness_change

triggers:
  - trigger: state
    entity_id: !input light_sensor_entity
  - trigger: state
    entity_id: !input trigger_light
    from: "off"
    to: "on"
  - trigger: state
    entity_id: !input presence_entities
    enabled: !input enable_presence_brightness
  - trigger: state
    entity_id: !input presence_entities
    to: "off"
    for:
      seconds: !input presence_hold_time
    enabled: !input enable_presence_brightness
  - trigger: time_pattern
    minutes: !input periodic_update_interval
    enabled: !input enable_periodic_update

conditions:
  - condition: template
    value_template: "{{ override_entity == 'none' or is_state(override_entity, 'off') }}"
  - condition: template
    value_template: "{{ has_value(sensor) or enable_sensor_fallback }}"
  - condition: template
    value_template: >-
      {% if not enable_sun_schedule or states('sun.sun') in ['unknown', 'unavailable'] %}
        true
      {% else %}
        {% set current_time = now() %}
        {% set next_rising = as_local(as_datetime(state_attr('sun.sun', 'next_rising'))) %}
        {% set next_setting = as_local(as_datetime(state_attr('sun.sun', 'next_setting'))) %}
        {% set today_rising = next_rising - timedelta(days=1) if next_rising.date() > current_time.date() else next_rising %}
        {% set today_setting = next_setting - timedelta(days=1) if next_setting.date() > current_time.date() else next_setting %}
        {% set day_start = as_timestamp(today_rising) + sunrise_offset | float(0) * 60 %}
        {% set day_end = as_timestamp(today_setting) + sunset_offset | float(0) * 60 %}
        {% set is_daytime = as_timestamp(current_time) >= day_start and as_timestamp(current_time) < day_end %}
        {{ is_daytime if sun_schedule_mode == 'day' else not is_daytime }}
      {% endif %}
  - condition: template
    value_template: >-
      {% if not enable_cover_condition %}
        true
      {% else %}
        {% set ns = namespace(matches=false) %}
        {% for cover in cover_entities %}
          {% set position = state_attr(cover, 'current_position') %}
          {% if position is not none %}
            {% set position = position | float(-1) %}
            {% if (cover_position_mode == 'below' and position <= (cover_position_threshold | float(0))) or (cover_position_mode == 'above' and position >= (cover_position_threshold | float(0))) %}
              {% set ns.matches = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.matches }}
      {% endif %}
  - condition: and
    conditions: !input run_conditions

actions:
  - variables:
      lux: "{{ states(sensor) | float(0) }}"
      sensor_available: "{{ has_value(sensor) }}"
      sleep_active: "{{ is_state(sleep_entity, 'on') if sleep_entity != 'none' else false }}"
      is_motion_trigger: >-
        {{ trigger.entity_id is defined and trigger.entity_id in presence_entities and trigger.to_state is defined and trigger.to_state.state == 'on' }}
      is_presence_event: >-
        {{ trigger.entity_id is defined and trigger.entity_id in presence_entities }}
      presence_detected: >-
        {% set ns = namespace(detected=false) %}
        {% for entity in presence_entities %}
          {% set state_obj = states[entity] %}
          {% if state_obj is not none %}
            {% set last_changed = (now() - state_obj.last_changed).total_seconds() %}
            {% if state_obj.state == 'on' or (state_obj.state == 'off' and last_changed < (hold_time | float(0))) %}
              {% set ns.detected = true %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.detected }}
      brightness: >-
        {% if sleep_active %}
          {{ (sleep_level | float(0) * 2.55) | round(0) | int }}
        {% else %}
          {% set lo = min_lux | float(0) %}{% set hi = max_lux | float(0) %}{% set x = lux | float(0) %}
          {% set low = min_level | float(0) * 2.55 %}{% set high = max_level | float(0) * 2.55 %}
          {% if outside and x > hi %}
            {% set value = above_level | float(0) * 2.55 %}
          {% elif outside and x < lo %}
            {% set value = below_level | float(0) * 2.55 %}
          {% elif hi > lo %}
            {% set value = low + (x - lo) * (high - low) / (hi - lo) %}
          {% else %}
            {% set value = low %}
          {% endif %}
          {% set fallback = sensor_fallback_brightness | float(1) * 2.55 %}
          {% set absent = no_presence_brightness | float(1) * 2.55 %}
          {% set final = fallback if not sensor_available else absent if (enable_presence_brightness and not (presence_detected | bool)) else value %}
          {{ ([1, ([255, final | round(0) | int] | min)] | max) }}
        {% endif %}
      mode: >-
        {% set setting = outside_color_mode if outside and (sensor_available | bool) else color_mode %}
        {{ 'rgb' if setting in ['include_color', 'include_color_outside_range'] else 'kelvin' if setting in ['include_temp', 'include_temp_outside_range', 'include_circadian'] else 'none' }}
      rgb: "{{ color_above if outside and (sensor_available | bool) and lux | float(0) > max_lux | float(0) else color_below if outside and (sensor_available | bool) and lux | float(0) < min_lux | float(0) else color }}"
      kelvin: >-
        {% if color_mode == 'include_circadian' and not sleep_active %}
          {% set sun_elev = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set circ_temp = circadian_min | float + (([0, sun_elev] | max) / 90) * (circadian_max | float - circadian_min | float) %}
          {{ circ_temp | int }}
        {% elif sleep_active %}
          {{ circadian_min | int }}
        {% else %}
          {{ temp_above if outside and (sensor_available | bool) and lux | float(0) > max_lux | float(0) else temp_below if outside and (sensor_available | bool) and lux | float(0) < min_lux | float(0) else temp }}
        {% endif %}
  - variables:
      lights_to_update: >-
        {% set threshold = minimum_brightness_change | float(0) * 2.55 %}
        {% set force_update = (is_motion_trigger | bool) or (sleep_active and trigger.entity_id == sleep_entity) %}
        {% set desired_brightness = brightness | int(1) %}
        
        {# Feltétel: Ha jelenlét vezérelt mód van, és nincs jelenlét, csak akkor frissítünk, ha mozgás-esemény történt #}
        {% set skip_update = (enable_presence_brightness | bool) and not (presence_detected | bool) and not is_presence_event %}
        
        {% set ns = namespace(lights=[]) %}
        {% if not skip_update %}
          {% for light in target_lights %}
            {% if is_state(light, 'on') %}
              {% set current_brightness = state_attr(light, 'brightness') %}
              {% if force_update or current_brightness is none or (((current_brightness | int(0)) - desired_brightness) | abs) >= threshold %}
                {% set ns.lights = ns.lights + [light] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.lights }}
  - condition: template
    value_template: "{{ lights_to_update | length > 0 }}"
  - action: light.turn_on
    target:
      entity_id: "{{ lights_to_update }}"
    data: >-
      {% set data = {'brightness': brightness | int(1), 'transition': transition | float(0)} %}
      {% if mode == 'rgb' %}{% set data = dict(data, rgb_color=rgb) %}
      {% elif mode == 'kelvin' %}{% set data = dict(data, color_temp_kelvin=kelvin | int(4000)) %}{% endif %}
      {{ data }}
